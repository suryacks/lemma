<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lemma Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: KPI row, daily chart, then breakdown tables (source, course, variant, pay) and the recent signups list. Reads the admin key from the URL fragment, so it never reaches GitHub or the server logs. */
:root{--bg:#0F1420;--panel:#151B2A;--raised:#1B2335;--line:#2A3448;--ink:#E8ECF4;--muted:#98A2B8;--blue:#58C4DD;--yellow:#FFD166;--pink:#FF6B8B;--green:#7BE0AD;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--body:"IBM Plex Sans",system-ui,sans-serif;--display:"STIX Two Text",Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:500 30px var(--display);margin:0}
h1 span{color:var(--yellow);font-style:italic}
.meta{font:12px var(--mono);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:18px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font:500 32px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font:12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi.goal b{color:var(--yellow)}
.bar-goal{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.bar-goal i{display:block;height:100%;background:var(--yellow)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;min-width:0}
.card h2{font:600 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.chart svg{width:100%;height:180px;display:block}
.legend{display:flex;gap:14px;font:12px var(--mono);color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--muted);font-size:14px}
.err{background:var(--raised);border:1px solid var(--pink);color:var(--pink);border-radius:10px;padding:14px;margin-top:16px}
form.key{display:flex;gap:8px;margin-top:12px}
form.key input{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
form.key button{background:var(--yellow);color:var(--bg);border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Lemma<span>.</span> tracker</h1><div class="meta" id="meta">loading…</div></header>
  <div id="app"></div>
</div>
<script>
const API="https://chimmychonga.tail70e09f.ts.net/lemma/api";
const GOAL=1000;
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null)continue;if(k==="class")e.className=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)))}return e}
let key=new URLSearchParams(location.hash.slice(1)).get("k")||"";
try{if(!key)key=localStorage.getItem("lemma-admin-key")||""}catch(e){}
const pct=(a,b)=>b?(100*a/b).toFixed(1)+"%":"–";
function table(title,rows,cols){
  return h("div",{class:"card"},h("h2",{},title),rows.length?h("div",{class:"tbl"},h("table",{},h("thead",{},h("tr",{},cols.map(c=>h("th",{},c)))),h("tbody",{},rows.map(r=>h("tr",{},r.map((c,i)=>h("td",{class:i&&typeof c!=="string"?"n":null},c))))))):h("div",{class:"empty"},"Nothing yet."));
}
function chart(d){
  const days=d.days.slice(-21),W=700,H=170,pad=24;
  const mx=Math.max(1,...days.map(x=>d.views_by_day[x]||0));
  const bw=(W-pad*2)/Math.max(days.length,1);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("preserveAspectRatio","none");
  let inner="";
  days.forEach((day,i)=>{const v=d.views_by_day[day]||0,s=d.signups_by_day[day]||0,x=pad+i*bw;
    const vh=(H-pad*2)*v/mx,sh=(H-pad*2)*s/mx;
    inner+=`<rect x="${x+bw*.1}" y="${H-pad-vh}" width="${bw*.38}" height="${vh}" fill="#58C4DD" rx="2"><title>${day}: ${v} views</title></rect>`;
    inner+=`<rect x="${x+bw*.52}" y="${H-pad-sh}" width="${bw*.38}" height="${sh}" fill="#FFD166" rx="2"><title>${day}: ${s} signups</title></rect>`;
    inner+=`<text x="${x+bw/2}" y="${H-6}" fill="#98A2B8" font-size="11" text-anchor="middle" font-family="monospace">${day.slice(5)}</text>`});
  svg.innerHTML=inner;
  return h("div",{class:"card chart"},h("h2",{},"Daily views and signups (last 21 days)"),svg,
    h("div",{class:"legend"},h("span",{},h("i",{style:"background:#58C4DD"}),"views"),h("span",{},h("i",{style:"background:#FFD166"}),"signups")));
}
function render(d){
  const v=d.views_total,s=d.signups_total;
  const kp=(label,val,cls)=>h("div",{class:"kpi"+(cls?" "+cls:"")},h("b",{},val),h("span",{},label));
  const goal=h("div",{class:"kpi goal"},h("b",{},`${s} / ${GOAL}`),h("span",{},"signups to goal"),h("div",{class:"bar-goal"},h("i",{style:`width:${Math.min(100,100*s/GOAL)}%`})));
  const srcRows=Object.entries(d.by_src).sort((a,b)=>b[1]-a[1]).map(([k,n])=>[k||"(none)",n]);
  const courseRows=Object.entries(d.by_course).sort((a,b)=>b[1]-a[1]).map(([k,n])=>[k||"(not picked)",n]);
  const varRows=Object.entries(d.variants).sort().map(([k,x])=>[k==="a"?"A: hardest topic, animated":k==="b"?"B: see why the formula works":k||"(none)",x.views,x.signups,pct(x.signups,x.views)]);
  const payRows=Object.entries(d.pay).sort((a,b)=>b[1]-a[1]).map(([k,n])=>[k,n]);
  const recent=d.recent.map(r=>[String(r.at||"").replace("T"," ").slice(0,16),r.email,r.course||"",r.school||"",r.pay||"",r.src||"",r.refs]);
  $("#app").replaceChildren(
    h("div",{class:"kpis"},goal,kp("page views",v),kp("visit → signup",pct(s,v)),kp("referred signups",d.referred),kp("filled profile",d.profiles)),
    chart(d),
    h("div",{class:"grid"},
      table("Signups by source",srcRows,["source / video","signups"]),
      table("Signups by course",courseRows,["course","signups"]),
      table("Headline test",varRows,["variant","views","signups","rate"]),
      table("Would pay",payRows,["answer","count"])),
    table("Recent signups",recent,["when (UTC)","email","course","school","pay","source","refs"]));
  $("#meta").textContent="updated "+new Date().toLocaleTimeString()+" · refreshes every minute";
}
function askKey(msg){
  const f=h("form",{class:"key"},h("input",{type:"password",placeholder:"Admin key","aria-label":"Admin key"}),h("button",{type:"submit"},"Open"));
  f.addEventListener("submit",e=>{e.preventDefault();key=f.querySelector("input").value.trim();try{localStorage.setItem("lemma-admin-key",key)}catch(x){}load()});
  $("#app").replaceChildren(h("div",{class:"err"},msg),f);$("#meta").textContent="";
}
async function load(){
  if(!key)return askKey("Enter the admin key to view the tracker.");
  try{const r=await fetch(API+"/report?key="+encodeURIComponent(key));
    if(r.status===403)return askKey("That key didn't work.");
    if(!r.ok)throw 0;try{localStorage.setItem("lemma-admin-key",key)}catch(e){}render(await r.json())}
  catch(e){$("#meta").textContent="Can't reach the server (is chimmychonga on?) · retrying";}
}
load();setInterval(load,60000);
</script>
</body>
</html>
